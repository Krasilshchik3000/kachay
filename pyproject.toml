[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kachay"
version = "0.1.0"
description = "Личный Telegram-бот: присылаешь ссылку на Instagram/YouTube — получаешь фото, видео или аудио"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "yt-dlp[default]>=2026.8.19",
    "gallery-dl>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kachay = "kachay.__main__:main"

[tool.setuptools.packages.find]
include = ["kachay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
