name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Тесты и линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff
      - run: ruff check --select E,F,W,I,B,UP --line-length 120 kachay tests
      - run: pytest -q

  docker:
    name: Сборка образа и smoke-тест
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, локально)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kachay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Инструменты внутри образа
        run: |
          docker run --rm --entrypoint sh kachay:ci -c '
            set -e
            deno --version
            ffmpeg -version | head -1
            yt-dlp --version
            gallery-dl --version
            python -c "import yt_dlp_ejs, kachay; print(\"kachay\", kachay.__version__)"
          '
      - name: Тесты внутри образа
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests:/app/tests:ro" kachay:ci -c '
            set -e
            pip install -q pytest
            cd /app && pytest -q
          '
      - name: Конфиг без токена завершает процесс с понятной ошибкой (без entrypoint, у него пауза 5 минут)
        run: |
          set +e
          out=$(docker run --rm --entrypoint python kachay:ci -m kachay 2>&1)
          rc=$?
          echo "$out"
          test $rc -eq 2 && echo "$out" | grep -q "BOT_TOKEN"

  publish:
    name: Публикация образа в GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Имя образа (ghcr требует нижний регистр)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
